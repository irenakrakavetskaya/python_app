[project]
name = "my-first-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irina K", email = "" }
]
requires-python = ">=3.15"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.49",
]

[project.scripts]
my-first-app = "my_first_app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.fastapi]
entrypoint = "main:app"
