[project]
name = "my-first-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irina K", email = "" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[project.scripts]
my-first-app = "my_first_app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.fastapi]
entrypoint = "main:app"