services:
  app:
    build: .
    command: sh -c "uv run alembic upgrade head && uv run fastapi dev src/my_first_app/main.py --host 0.0.0.0"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      UV_NO_DEV: "0"   # install dev dependencies (pytest, ruff) in dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: